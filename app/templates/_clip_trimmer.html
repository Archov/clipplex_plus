<div class="modal fade" id="clip_trim_modal" tabindex="-1" aria-labelledby="clip_trim_title" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-fullscreen-sm-down">
    <div class="modal-content trim-modal-content">
      <div class="modal-header">
        <div><h2 class="modal-title h5" id="clip_trim_title">Trim clip</h2><p id="clip_trim_subtitle" class="small text-muted mb-0"></p></div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="clip_trim_error" class="alert alert-danger d-none" role="alert"></div>
        <div id="clip_source_setup" class="d-none">
          <p id="clip_source_message" class="mb-3">Checking the saved original Plex media…</p>
          <div id="clip_source_tracks" class="d-none row g-3 mb-3">
            <div class="col-md-6"><label for="clip_source_audio" class="form-label">Audio</label><select id="clip_source_audio" class="form-select"></select></div>
            <div class="col-md-6"><label for="clip_source_subtitle" class="form-label">Subtitles</label><select id="clip_source_subtitle" class="form-select"></select></div>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button id="load_source_preview" type="button" class="btn btn-primary" disabled><i class="fas fa-film me-2" aria-hidden="true"></i>Load original preview</button>
          </div>
        </div>

        <div id="clip_trim_progress" class="d-none" role="status" aria-live="polite">
          <div class="d-flex justify-content-between gap-3"><span id="clip_trim_progress_message">Queued</span><strong id="clip_trim_progress_percent">0%</strong></div>
          <div class="progress mt-2"><div id="clip_trim_progress_bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width:0%"></div></div>
        </div>

        <div id="clip_trim_editor" class="d-none">
          <video id="clip_trim_player" class="trim-player" controls playsinline preload="metadata"></video>
          <div class="trim-selection-summary" aria-live="polite">
            <span><strong>Selected</strong> <span id="clip_trim_duration">00:00:00.000</span></span>
            <span id="clip_trim_source_range"></span>
          </div>
          <div id="clip_trim_timeline" class="trim-timeline" style="--trim-start:0%;--trim-end:100%">
            <div class="trim-timeline-base"></div><div class="trim-timeline-selection"></div>
            <input id="clip_trim_start_range" class="trim-range-input" type="range" min="0" max="1000" step="1" value="0" aria-label="Trim start">
            <input id="clip_trim_end_range" class="trim-range-input" type="range" min="0" max="1000" step="1" value="1000" aria-label="Trim end">
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label id="clip_trim_start_label" for="clip_trim_start_text" class="form-label">Start in clip</label>
              <div class="input-group"><input id="clip_trim_start_text" class="form-control trim-time-input" inputmode="numeric" placeholder="00:00:00.000"><button id="set_trim_start" class="btn btn-outline-secondary" type="button">Set to playhead</button></div>
            </div>
            <div class="col-md-6">
              <label id="clip_trim_end_label" for="clip_trim_end_text" class="form-label">End in clip</label>
              <div class="input-group"><input id="clip_trim_end_text" class="form-control trim-time-input" inputmode="numeric" placeholder="00:00:10.000"><button id="set_trim_end" class="btn btn-outline-secondary" type="button">Set to playhead</button></div>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-3">
            <button id="preview_trim_selection" type="button" class="btn btn-outline-primary"><i class="fas fa-play me-2" aria-hidden="true"></i>Preview selection</button>
            <button id="load_source_earlier" type="button" class="btn btn-outline-secondary d-none"><i class="fas fa-backward me-2" aria-hidden="true"></i>Load 30s earlier</button>
            <button id="load_source_later" type="button" class="btn btn-outline-secondary d-none">Load 30s later<i class="fas fa-forward ms-2" aria-hidden="true"></i></button>
          </div>
          <div class="mt-3">
            <label for="trim_new_title" class="form-label">New clip title</label>
            <input id="trim_new_title" class="form-control" maxlength="255">
            <div class="form-text">Used only when saving a new clip.</div>
          </div>
        </div>
      </div>
      <div id="clip_trim_footer" class="modal-footer trim-modal-footer d-none">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="replace_trimmed_clip" type="button" class="btn btn-outline-danger">Replace existing</button>
        <button id="save_trimmed_copy" type="button" class="btn btn-primary">Save as new</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="replace_trim_modal" tabindex="-1" aria-labelledby="replace_trim_title" aria-describedby="replace_trim_message" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="replace_trim_title">Replace existing clip?</h2><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><p id="replace_trim_message"></p><p class="small text-muted mb-0">The existing video will be replaced and its cached GIF will be removed. This cannot be undone.</p><div id="replace_trim_error" class="alert alert-danger d-none mt-3 mb-0" role="alert"></div></div>
    <div class="modal-footer"><button id="cancel_replace_trim" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button id="confirm_replace_trim" type="button" class="btn btn-danger">Replace clip</button></div>
  </div></div>
</div>
