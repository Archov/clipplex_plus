<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Create, organize, and share clips from Plex." />
        <meta name="theme-color" content="#0b0d12" />
        <title>{% if title %}{{ title }} · {% endif %}Clipplex</title>
        <link rel="icon" type="image/png" href="/static/icons/clipplex_icon.png">
        <link href="/static/css/styles.css" rel="stylesheet" />
        <script src="/static/js/all.min.js" crossorigin="anonymous"></script>
        <script src="/static/js/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
        {% block head %}{% endblock %}
    </head>
    <body class="sb-nav-fixed">
        <a class="visually-hidden-focusable skip-link" href="#main_content">Skip to content</a>
        <nav class="sb-topnav navbar navbar-expand navbar-dark" aria-label="Primary navigation">
            <!-- Navbar Brand-->
            <a class="navbar-brand ps-3" href="/instant_video.html"><img src="/static/icons/clipplex_icon.png" width="38" height="38" alt=""> <span>Clipplex</span></a>
            <!-- Sidebar Toggle-->
            <button class="btn btn-link order-1 order-lg-0 me-3" id="sidebarToggle" type="button" aria-controls="sidenavAccordion" aria-expanded="false" aria-label="Toggle navigation"><i class="fas fa-bars" aria-hidden="true"></i></button>
            <!-- Navbar-->
            <!--
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="#!">Settings</a></li>
                        <li><a class="dropdown-item" href="#!">Activity Log</a></li>
                        <li><hr class="dropdown-divider" /></li>
                        <li><a class="dropdown-item" href="#!">Logout</a></li>
                    </ul>
                </li>
            </ul>
        -->
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Create &amp; manage</div>
                            <a class="nav-link{% if active_page == 'make_clip' %} active{% endif %}" href="/instant_video.html"{% if active_page == 'make_clip' %} aria-current="page"{% endif %}>
                                <div class="sb-nav-link-icon"><i class="fas fa-hand-scissors"></i></div>
                                Make Clip
                            </a>
                            <a class="nav-link{% if active_page == 'clip_library' %} active{% endif %}" href="/clip_library.html"{% if active_page == 'clip_library' %} aria-current="page"{% endif %}>
                                <div class="sb-nav-link-icon"><i class="fas fa-photo-video"></i></div>
                                Clip Library
                            </a>
                            <a class="nav-link{% if active_page == 'settings' %} active{% endif %}" href="/settings.html"{% if active_page == 'settings' %} aria-current="page"{% endif %}>
                                <div class="sb-nav-link-icon"><i class="fas fa-cog"></i></div>
                                Settings
                            </a>
                            <!--
                            <a class="nav-link" href="instant_snapshot.html">
                                <div class="sb-nav-link-icon"><i class="fas fa-camera-retro"></i></div>
                                Take a snapshot
                            </a>
                            <a class="nav-link" href="index.html">
                                <div class="sb-nav-link-icon"><i class="fas fa-folder-open"></i></div>
                                View files
                            </a>-->
                        </div>
                    </div>
                    <!--
                    <div class="sb-sidenav-footer">
                        <div class="small">Logged in as:</div>
                        jonike
                    </div>-->
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main id="main_content" tabindex="-1">
                    <div class="container-fluid app-container">
                        {% block content %}{% endblock %}
                    </div>
                </main>
            </div>
        </div>
    <script src="/static/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/static/js/scripts.js"></script>
    {% block scripts %}{% endblock %}
    </body>
</html>
